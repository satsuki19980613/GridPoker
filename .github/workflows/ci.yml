# プルリクエストと push ごとに、単体テスト（DB のテストを含む）とビルドを確かめる。
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gptest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gptest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: テスト用の DB（Neon と同じロールと neon_auth のひな形）にマイグレーションを適用
        run: |
          psql -h localhost -U postgres -d gptest -v ON_ERROR_STOP=1 -q -f scripts/test-db-stub.sql
          for f in db/migrations/*.sql; do psql -h localhost -U postgres -d gptest -v ON_ERROR_STOP=1 -q -f "$f"; done
      - run: npm test
      - run: npm run build
